name: Build draft release
on: workflow_dispatch
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: npm pack --pack-destination dist
      - name: Package source for store review
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git archive --format=zip --output="dist/m47-v$VERSION-source.zip" "$GITHUB_SHA"
      - name: Create private draft with reviewed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" dist/*.zip dist/*.tgz dist/SHA256SUMS.txt --target "$GITHUB_SHA" --draft --title "M47 $VERSION" --notes-file docs/RELEASE.md
