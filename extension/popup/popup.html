<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"swept Antonio";src:url("../fonts/Antonio.ttf") format("truetype");
    font-weight:100 700;}
  :root{
    --s1:#FF9966;--s2:#FFCC66;--s3:#CC6666;--lilac:#CC99CC;--tanoi:#FFCC99;
    --bright:#FFFF99;--text:#EDE7DB;--dim:#B9AE9C;--plum:#664466;--deep:#006699;
  }
  body{width:280px;margin:0;background:#000;color:var(--text);
    font-family:"swept Antonio","Arial Narrow",sans-serif;padding:0 12px 12px;}
  .frame{display:flex;gap:3px;align-items:flex-start;padding-top:10px;}
  .elbow{width:56px;height:34px;background:var(--s1);border-top-left-radius:18px;
    position:relative;flex:none;}
  .elbow::after{content:"";position:absolute;right:0;bottom:0;width:22px;height:16px;
    background:#000;border-top-left-radius:7px;}
  .bar{flex:1;height:18px;background:var(--s1);display:flex;align-items:center;
    justify-content:flex-end;padding:0 8px;}
  .bar b{color:#000;font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
  .cap{width:20px;height:18px;background:var(--s2);border-radius:0 9px 9px 0;flex:none;}
  h1{font-size:26px;font-weight:200;color:var(--bright);text-transform:uppercase;
    margin:10px 0 0;letter-spacing:.02em;}
  .host{font-size:11px;color:var(--dim);margin:2px 0 12px;text-transform:uppercase;
    letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lbl{font-size:11px;color:var(--s2);text-transform:uppercase;letter-spacing:.1em;
    margin:12px 0 6px;}
  .row{display:flex;gap:3px;}
  .row button{flex:1;border:0;padding:8px 0 7px;font:inherit;font-weight:700;
    font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#000;
    background:#3a3a3a;cursor:pointer;}
  .row button:first-child{border-radius:14px 0 0 14px;}
  .row button:last-child{border-radius:0 14px 14px 0;}
  .row button.on{outline:2px solid var(--bright);outline-offset:-2px;}
  .row .full{background:var(--s1);} .row .palette{background:var(--lilac);}
  .row .off{background:var(--plum);color:var(--text);}
  .note{font-size:10.5px;color:var(--dim);margin-top:12px;line-height:1.5;}
  .foot{display:flex;gap:3px;margin-top:12px;align-items:center;}
  .foot .b1{flex:1;height:8px;background:var(--s3);}
  .foot .c1{width:16px;height:8px;background:var(--tanoi);border-radius:0 4px 4px 0;}
</style>
</head>
<body>
  <div class="frame"><div class="elbow"></div><div class="bar"><b>M47 0.1</b></div><div class="cap"></div></div>
  <h1>M47</h1>
  <div class="host" id="host">—</div>

  <div class="lbl">This site</div>
  <div class="row" id="site">
    <button class="full" data-m="full">Full</button>
    <button class="palette" data-m="palette">Palette</button>
    <button class="off" data-m="off">Off</button>
  </div>

  <div class="lbl">Everywhere (default)</div>
  <div class="row" id="global">
    <button class="full" data-m="full">Full</button>
    <button class="palette" data-m="palette">Palette</button>
    <button class="off" data-m="off">Off</button>
  </div>

  <div class="note">Changes reload the tab. FULL = restyle + frame chrome ·
  PALETTE = colors/type/shapes only. Alt+Shift+L cycles this site.</div>
  <div class="foot"><div class="b1"></div><div class="c1"></div></div>
  <script src="popup.js"></script>
</body>
</html>
