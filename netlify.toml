[build]
  command = "npm ci && npm run build"
  publish = "dist/web"
[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
